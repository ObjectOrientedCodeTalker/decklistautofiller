# Builds the store zip and publishes it as a GitHub release when a version tag is pushed.
#
#   git tag v2.1.0
#   git push origin v2.1.0
#
# The tag must match "version" in manifest.json, so a release can't go out with the wrong zip.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the zip
        run: node tools/package.mjs

      # Notes come from this version's section of CHANGELOG.md ("## 2.1.0" up to the next
      # "## "). Without one, GitHub writes notes from the commits instead.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            notes=(--notes-file notes.md)
          else
            echo "::warning::No section for $VERSION in CHANGELOG.md; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "dist/decklist-auto-filler-$VERSION.zip" \
            --title "Decklist Auto-Filler $VERSION" \
            "${notes[@]}"
